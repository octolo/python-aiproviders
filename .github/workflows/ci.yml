name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    name: Python 3.12 / Django 5.2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install -e ./python-aiproviders -e ./django-aiproviders pytest pytest-django "Django==5.2.*"
          python -m pip check
      - name: Django system check (non-blocking during adoption)
        id: django
        continue-on-error: true
        working-directory: django-aiproviders
        run: python manage.py check
      - name: Report Django check
        if: steps.django.outcome == 'failure'
        run: |
          echo "::warning::The Django check failed; see the check step."
          echo "Django check failed and is temporarily non-blocking." >> "$GITHUB_STEP_SUMMARY"
      - name: Run Python tests
        working-directory: python-aiproviders
        run: |
          if [ -d tests ] && find tests -name 'test*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "::warning::No automated Python tests are present."
            echo "No automated Python tests are present." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Django tests
        working-directory: django-aiproviders
        run: |
          if find tests -name 'test*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "::warning::No automated Django tests are present."
            echo "No automated Django tests are present." >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint (non-blocking during adoption)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.18
      - name: Ruff
        id: lint
        continue-on-error: true
        run: python -m ruff check .
      - name: Report lint findings
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::Ruff reported findings; see the lint step."
          echo "Ruff is temporarily non-blocking." >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: python-aiproviders
            advisory: true
          - package: django-aiproviders
            advisory: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Static security scan
        id: bandit
        continue-on-error: ${{ matrix.advisory }}
        working-directory: ${{ matrix.package }}
        run: python -m bandit -q -r src -ll -ii
      - name: Report security findings
        if: steps.bandit.outcome == 'failure'
        run: |
          echo "::warning::Bandit reported findings or failed for ${{ matrix.package }}."
          echo "Bandit requires review for ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
      - name: Audit Python package dependencies
        if: matrix.package == 'python-aiproviders'
        working-directory: python-aiproviders
        run: python -m pip_audit . --progress-spinner off
      - name: Report Django audit limitation
        if: matrix.package == 'django-aiproviders'
        run: |
          echo "::warning::The Django dependency audit requires the unpublished local aiproviders package."
          echo "Django dependency audit not yet available: local aiproviders is unpublished." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.package }}
    needs: [checks, lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [python-aiproviders, django-aiproviders]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distributions
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: built-wheels-${{ matrix.package }}
          path: ${{ matrix.package }}/dist/*.whl
          if-no-files-found: error


  install-wheels:
    name: Install built wheels in a clean environment
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "built-wheels*"
          path: ${{ runner.temp }}/built-wheels
          merge-multiple: true
      - name: Install and verify wheels outside the checkout
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/built-wheels/*.whl)
          if [ "${#wheels[@]}" -ne 2 ]; then
            echo "::error::Expected 2 built wheel(s), found ${#wheels[@]}."
            exit 1
          fi
          python - "${wheels[@]}" <<'PY'
          from email.parser import BytesParser
          import re
          import sys
          from zipfile import ZipFile

          names = []
          for wheel in sys.argv[1:]:
              with ZipFile(wheel) as archive:
                  metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                  if len(metadata) != 1:
                      raise SystemExit(f"Invalid wheel metadata: {wheel}")
                  name = BytesParser().parsebytes(archive.read(metadata[0]))["Name"]
                  if not name:
                      raise SystemExit(f"Missing wheel distribution name: {wheel}")
                  names.append(re.sub(r"[-_.]+", "-", name).lower())
          if sorted(names) != ['aiproviders', 'django-aiproviders']:
              raise SystemExit(f"Unexpected wheel distributions: {names}")
          PY
          python -m venv "$RUNNER_TEMP/wheel-test"
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install "${wheels[@]}" "Django==5.2.*"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
          import importlib
          from importlib.metadata import distribution
          from pathlib import Path

          import django
          from django.conf import settings
          settings.configure(
              SECRET_KEY="wheel-smoke-test",
              INSTALLED_APPS=["django.contrib.contenttypes", "django.contrib.auth"],
              DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          )
          django.setup()

          for name, module_name in [('aiproviders', 'aiproviders'), ('django-aiproviders', 'django_aiproviders')]:
              dist = distribution(name)
              module = importlib.import_module(module_name)
              location = Path(module.__file__).resolve()
              files = dist.files
              if files is None or location not in {Path(dist.locate_file(file)).resolve() for file in files}:
                  raise SystemExit(f"{module_name} was not imported from the installed {name} wheel: {location}")
              print(f"{name} {dist.version}: {location}")
          PY

  maintainability:
    name: Radon maintainability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Radon
        id: radon_install
        continue-on-error: true
        run: python -m pip install radon==6.0.1
      - name: Report installation failure
        if: steps.radon_install.outcome == 'failure'
        run: |
          echo "::warning::Radon could not be installed; maintainability was not checked."
          echo "Radon could not be installed; maintainability was not checked." >> "$GITHUB_STEP_SUMMARY"
      - name: Report maintainability
        if: steps.radon_install.outcome == 'success'
        continue-on-error: true
        run: |
          for source in "django-aiproviders/src" "python-aiproviders/src"; do
            if ! report=$(python -m radon mi "$source" -s -e '*/migrations/*'); then
              echo "::warning::Radon could not generate the report for $source."
              exit 1
            fi
            printf '### Radon maintainability index: %s\n\n```\n%s\n```\n' "$source" "$report" >> "$GITHUB_STEP_SUMMARY"
          done

  local-audit:
    name: Full audit (progressive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        id: audit_setup
        continue-on-error: true
        run: |
          python -m pip install -e "./python-aiproviders" -e "./django-aiproviders" "Django==5.2.*"
          python -m pip install "ruff==0.15.18" mypy bandit pip-audit vulture radon xenon pytest pytest-django pytest-cov build twine
      - name: Report setup failure
        if: steps.audit_setup.outcome == 'failure'
        run: |
          echo "::warning::Audit dependencies could not be installed; the full audit did not run."
          echo "Audit dependencies could not be installed; the full audit did not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Run audit
        id: audit
        if: steps.audit_setup.outcome == 'success'
        continue-on-error: true
        run: make audit PYTHON=python
      - name: Report audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::The full audit reported failures; see the audit step."
          echo "Full audit reported failures; see the audit step." >> "$GITHUB_STEP_SUMMARY"
